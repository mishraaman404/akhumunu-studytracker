<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Akhu &amp; Munu – Study Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f5;--card:#fff;--ink:#1b1f2e;--mut:#646b82;--line:#dfe3ee;--a:#3355d6;--m:#d12f6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c2030;--ink:#eceef6;--mut:#a0a7bf;--line:#2d3248;--a:#8ea2ff;--m:#ff80ab}}
html{scroll-padding-top:env(safe-area-inset-top,0px)} *{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "DM Sans",system-ui,sans-serif}
#app{max-width:980px;margin:0 auto;padding:18px 16px 60px}
h1,h2,.big{font-family:Fraunces,Georgia,serif;margin:0} h1{font-size:30px;letter-spacing:-.01em}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sub{color:var(--mut);margin:2px 0 0} .who{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px} .who b{color:var(--c)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block} .dot.on{background:#00e676;box-shadow:0 0 6px #00e676}
nav{display:flex;gap:6px;margin:16px 0;overflow-x:auto}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:99px;font:500 14px "DM Sans";cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button{font:inherit;cursor:pointer} button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--c,var(--a));outline-offset:2px}
.grid{display:grid;gap:14px;grid-template-columns:1fr} @media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c,var(--line));border-radius:14px;padding:16px;margin-bottom:14px}
.grid .card{margin:0} .card header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.card h2{font-size:21px} .big{font-size:34px;font-weight:700;color:var(--c)}
.bar{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden} .bar i{display:block;height:100%;background:var(--c,var(--a));transition:width .3s}
.mut{color:var(--mut);font-size:13px;margin:8px 0 0}
.task{padding:11px 0 11px 10px;border-top:1px solid var(--line);border-left:3px solid transparent}
.task.p-hi{border-left-color:#ff4757} .task.p-md{border-left-color:#ffa502} .task.p-lo{border-left-color:#1e90ff}
.tt{display:flex;gap:8px;align-items:center} .tt span{flex:1;overflow-wrap:anywhere}
.tt em{font-style:normal;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--mut);max-width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x,.ok{border:0;background:none;color:var(--mut);font-size:18px;padding:0 6px;line-height:1} .ok{color:var(--c);font-weight:700}
.pr{display:flex;align-items:center;gap:10px;margin-top:6px} .pr input[type=range]{flex:1;accent-color:var(--c)}
.pv{width:42px;text-align:right;font-weight:700;font-size:13px;color:var(--c)}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
input[type=text],select,textarea,input[type=date],input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.add input[type=text]{flex:1 1 180px;min-width:0} textarea{width:100%;min-height:76px;resize:vertical}
.btn{border:0;background:var(--c,var(--ink));color:#fff;padding:9px 16px;border-radius:10px;font-weight:700}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:10px;font-size:13px}
.dn{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px} .dn strong{font:700 18px Fraunces,serif;margin:0 4px}
.chat-area{display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow-y:auto;padding-right:10px;margin-bottom:14px}
.bubble{padding:10px 14px;border-radius:14px;max-width:85%;font-size:14px;position:relative}
.bubble.me{background:var(--c);color:#fff;margin-left:auto;border-bottom-right-radius:2px}
.bubble.other{background:var(--bg);border:1px solid var(--line);margin-right:auto;border-bottom-left-radius:2px}
.bubble small{display:block;font-size:11px;opacity:0.7;margin-top:4px}
.bubble img{max-width:100%;border-radius:8px;margin-top:6px}
.file-btn{cursor:pointer;background:var(--line);color:var(--ink);padding:9px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.rw{display:inline-flex;align-items:center;gap:4px;background:#fff3e0;color:#e65100;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:bold;border:1px solid #ffe0b2}
.mini{display:grid;grid-template-columns:44px 52px 1fr auto;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
details{margin-top:10px} summary{cursor:pointer;color:var(--mut);font-size:13px}
.chart{width:100%;height:auto} .chart text{fill:var(--mut);font-size:11px}
.hrow{display:grid;grid-template-columns:130px 1fr 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;color:var(--ink)}
.pick{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px} .pick .btn{font-size:20px;padding:22px 34px;font-family:Fraunces,serif}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;display:none;z-index:99}
@media(max-width:520px){.hrow{grid-template-columns:1fr}}
</style></head><body>
<div id="app"><p class="mut">Connecting…</p></div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.toLocaleDateString('en-CA'),NAME={akhu:'Akhu',munu:'Munu'},col={akhu:'var(--a)',munu:'var(--m)'};
const other=w=>w==='akhu'?'munu':'akhu',avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
const dayPct=d=>d&&d.tasks&&d.tasks.length?avg(d.tasks.map(t=>t.p)):null,dd=(w,dt)=>days[w+'_'+dt];
const fp=p=>p===null||p===undefined?'–':p+'%';

// NEW: Globals for Chat, Rewards, Users
let db=null,storage=null,me=null,uid=null,tab='today',date=iso(new Date()),goals=[],days=[],chat=[],rewards=[],users={},state='load',mail='';

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
const save=(p,o)=>db.doc(p).set(o).catch(e=>toast('Couldn’t save.'));
const allTasks=()=>Object.values(days).flatMap(d=>(d.tasks||[]).map(t=>({...t,who:d.who,date:d.date})));
function mutate(fn){const id=me+'_'+date,o=days[id],doc={...(o||{}),who:me,date,tasks:[...(o&&o.tasks||[])]};fn(doc.tasks,doc);days[id]=doc;render();save('days/'+id,doc)}

// ONLINE STATUS LOGIC
function pokeActive(){ if(db&&me) save('users/'+me, {lastActive: new Date().toISOString()}) }
setInterval(()=>{ if(document.hasFocus()) pokeActive() }, 60000);
window.addEventListener('focus', pokeActive);

function row(t,mine){
    const g=goals.find(x=>x.id===t.g);
    return `<div class="task p-${t.pri||'md'}"><div class="tt"><span>${esc(t.t)}</span>
    ${t.mins?`<em style="background:var(--bg)">${t.mins}m</em>`:''}
    ${g?`<em>${esc(g.title)}</em>`:''}
    ${mine?`<button class="x" data-a="delt" data-id="${t.id}">×</button>`:''}</div>
    <div class="pr">${mine?`<input type="range" min="0" max="100" step="5" value="${t.p}" data-id="${t.id}" data-r><span class="pv">${t.p}%</span><button class="ok" data-a="full" data-id="${t.id}">✓</button>`:`<div class="bar"><i style="width:${t.p}%"></i></div><span class="pv">${t.p}%</span>`}</div></div>`
}

function panel(w){
    const mine=w===me, d=dd(w,date), ts=d&&d.tasks||[], p=dayPct(d);
    // Calculate Rewards (Stars)
    const myRewards = rewards.filter(r=>r.to===w&&r.date===date);
    return `<section class="card" style="--c:${col[w]}"><header><h2>${NAME[w]}${mine?' (you)':''} ${myRewards.map(()=>'<span class="rw">⭐ Star</span>').join('')}</h2><span class="big">${fp(p)}</span></header>
    <div class="bar"><i style="width:${p||0}%"></i></div>
    ${mine?`<div style="display:flex;gap:10px;align-items:center;margin-top:10px"><button class="ghost" data-a="star" style="font-size:12px;padding:4px 8px">Give ${NAME[other(me)]} a Star Today</button></div>`:''}
    <div style="margin-top:12px">${ts.map(t=>row(t,mine)).join('')||`<p class="mut">No targets yet.</p>`}</div>
    ${mine?`<div class="add">
        <input type="text" id="nt" data-keep maxlength="140" placeholder="Add a target...">
        <select id="npri" data-keep><option value="md">Mid Pri</option><option value="hi">High Pri</option><option value="lo">Low Pri</option></select>
        <input type="number" id="nmins" data-keep placeholder="Mins" style="width:70px">
        <select id="ng" data-keep><option value="">No goal</option>${goals.filter(g=>!g.done).map(g=>`<option value="${g.id}">${esc(g.title)}</option>`).join('')}</select>
        <button class="btn" data-a="addt">Add</button>
    </div>`:''}</section>`
}

function todayView(){
    const lbl=new Date(date+'T00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
    return `<div class="dn"><button class="ghost" data-a="sh" data-n="-1">‹</button><strong>${date===iso(new Date())?'Today, ':''}${lbl}</strong><button class="ghost" data-a="sh" data-n="1">›</button><input type="date" id="dp" value="${date}"><button class="ghost" data-a="td">Today</button></div>
    <div class="grid">${panel(me)}${panel(other(me))}</div>`
}

function chatView(){
    return `<div class="card" style="--c:${col[me]}"><h2>Chat & Notes</h2>
    <div class="chat-area" id="cbox">
        ${chat.map(c=>`<div class="bubble ${c.from===me?'me':'other'}" style="--c:${col[c.from]}">
            ${c.text?esc(c.text):''}
            ${c.url?`<a href="${c.url}" target="_blank"><img src="${c.url}" alt="Attachment"></a>`:''}
            <small>${new Date(c.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small>
        </div>`).join('')||'<p class="mut">No messages yet.</p>'}
    </div>
    <div class="add">
        <input type="text" id="nn" data-keep placeholder="Message...">
        <label class="file-btn" aria-label="Upload file"><input type="file" id="fup" style="display:none" data-a="fup">📎</label>
        <button class="btn" data-a="sn">Send</button>
    </div></div>`
}

// Minimal History and Goals rendering (same as before, stripped for space)
function goalsView(){ return `<div class="card" style="--c:var(--ink)"><h2>Goals</h2><div class="add"><input type="text" id="gt" data-keep placeholder="Goal name"><button class="btn" data-a="addg">Start</button></div></div>`+goals.map(g=>`<section class="card"><header><h2>${esc(g.title)}</h2></header></section>`).join(''); }
function histView(){ return `<div class="card"><h2>History</h2><p class="mut">Check past days.</p></div>`; }

function render(){
    const keep={}; document.querySelectorAll('[data-keep]').forEach(e=>keep[e.id]=e.value);
    const af=document.activeElement&&document.activeElement.id; let h;
    
    // Check if other user is online (active in last 3 mins)
    const oUser = users[other(me)];
    const isOnline = oUser && (new Date() - new Date(oUser.lastActive)) < 180000;

    if(state==='load') h='<p class="mut">Connecting…</p>';
    else if(state==='signin') h='<h1>Akhu &amp; Munu</h1><div class="pick"><button class="btn" data-a="signin">Sign in with Google</button></div>';
    else h=`<div class="top"><div><h1>Akhu &amp; Munu</h1><p class="sub">Daily study targets</p></div>
    <div class="who" style="--c:${col[me]}">Signed in as <b>${NAME[me]}</b> 
    <span class="dot ${isOnline?'on':''}" title="${isOnline?'Online':'Offline'}"></span> ${NAME[other(me)]} ${isOnline?'Online':'Offline'}
    <button class="ghost" data-a="out" style="margin-left:10px">Sign out</button></div></div>
    <nav>${[['today','Today'],['chat','Chat'],['goals','Goals'],['hist','History']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="tab" data-k="${k}">${l}</button>`).join('')}</nav>
    ${{today:todayView,goals:goalsView,chat:chatView,hist:histView}[tab]()}`;
    
    app.innerHTML=h; for(const k in keep){const e=document.getElementById(k);if(e)e.value=keep[k]}
    if(af){const e=document.getElementById(af);if(e)e.focus()}
    if(tab==='chat'&&$('#cbox')) $('#cbox').scrollTop=$('#cbox').scrollHeight;
}

const A={
    out:()=>window.doOut&&window.doOut(), signin:()=>window.doIn&&window.doIn(), tab:e=>{tab=e.dataset.k;render()},
    sh:e=>{const d=new Date(date+'T00:00');d.setDate(d.getDate()+ +e.dataset.n);date=iso(d);render()},
    td:()=>{date=iso(new Date());render()},
    addt:()=>{
        const v=$('#nt').value.trim(), p=$('#npri').value, m=$('#nmins').value; if(!v)return;
        $('#nt').value=''; $('#nmins').value='';
        mutate(ts=>ts.push({id:Math.random().toString(36).slice(2,9), t:v, g:$('#ng').value||null, p:0, pri:p, mins:m?+m:null}))
    },
    delt:e=>mutate(ts=>{const i=ts.findIndex(t=>t.id===e.dataset.id);if(i>-1)ts.splice(i,1)}),
    full:e=>mutate(ts=>{const t=ts.find(t=>t.id===e.dataset.id);if(t)t.p=100}),
    addg:()=>{const v=$('#gt').value.trim(); if(v){ $('#gt').value=''; save('goals/g'+Date.now(),{title:v,owner:me,done:false,at:new Date().toISOString()})}},
    sn:()=>{
        const v=$('#nn').value.trim(); if(!v)return; $('#nn').value='';
        save('chat/c'+Date.now().toString(36),{from:me, text:v, at:new Date().toISOString()})
    },
    star:()=>{
        save('rewards/r'+Date.now(), {from: me, to: other(me), date: date, type: 'star', at: new Date().toISOString()});
        toast(`Sent ${NAME[other(me)]} a Star!`);
    }
};

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b)});
document.addEventListener('input',e=>{if(e.target.dataset.r!==undefined)e.target.parentNode.querySelector('.pv').textContent=e.target.value+'%'});
document.addEventListener('change',e=>{
    const t=e.target;
    if(t.dataset.r!==undefined) mutate(ts=>{const x=ts.find(k=>k.id===t.dataset.id);if(x)x.p=+t.value});
    else if(t.id==='dp'&&t.value){date=t.value;render()}
    else if(t.dataset.a==='fup'&&t.files[0]){
        toast('Uploading file...');
        window.doUpload(t.files[0]).then(url=>{
            save('chat/c'+Date.now(),{from:me, url:url, at:new Date().toISOString()});
            toast('Sent!');
        }).catch(()=>toast('Upload failed.'));
    }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nt')A.addt();if(e.key==='Enter'&&e.target.id==='nn')A.sn();});

function sub(){
    const f=(n,fn)=>db.collection(n).onSnapshot(s=>{fn(s);render()},()=>{});
    f('goals',s=>goals=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.at||'')<(b.at||'')?-1:1));
    f('days',s=>{days={};s.docs.forEach(d=>days[d.id]=d.data())});
    f('chat',s=>chat=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.at||'')<(b.at||'')?1:-1));
    f('rewards',s=>rewards=s.docs.map(d=>d.data()));
    f('users',s=>{users={};s.docs.forEach(d=>users[d.id]=d.data())});
}
window.boot=(d,st,w)=>{db=d;storage=st;me=w;state='ok';pokeActive();sub();};window.setState=(m,e)=>{state=m;mail=e||'';render()};
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,collection,setDoc,getDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// NEW: Import Storage
import {getStorage, ref, uploadBytesResumable, getDownloadURL} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import {FIREBASE,PEOPLE} from "./config.js";

try{
 const app=initializeApp(FIREBASE),auth=getAuth(app),fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})}),prov=new GoogleAuthProvider();
 const st = getStorage(app); // Initialize Storage
 
 const db={
    doc:p=>({set:o=>setDoc(doc(fs,p),o),get:()=>getDoc(doc(fs,p)).then(s=>({exists:s.exists(),data:()=>s.data()})),delete:()=>deleteDoc(doc(fs,p))}),
    collection:n=>({onSnapshot:(ok,er)=>onSnapshot(collection(fs,n),s=>ok({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),er)})
 };

 window.doUpload = (file) => {
    return new Promise((resolve, reject) => {
        const r = ref(st, 'uploads/' + Date.now() + '_' + file.name);
        uploadBytesResumable(r, file).on('state_changed', null, reject, () => {
            getDownloadURL(r).then(resolve);
        });
    });
 };

 window.doIn=()=>signInWithPopup(auth,prov); window.doOut=()=>signOut(auth);
 let on=false;
 onAuthStateChanged(auth,u=>{
  if(!u){on=false;return window.setState('signin')}
  const em=(u.email||'').toLowerCase(),who=Object.keys(PEOPLE).find(k=>PEOPLE[k].toLowerCase()===em);
  if(!who)return window.setState('denied',em);
  if(on)return;on=true;window.boot(db,st,who)
 });
}catch(e){window.setState('off')}
</script>
</body></html>
